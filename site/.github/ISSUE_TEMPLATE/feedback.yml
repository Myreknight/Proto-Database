name: Send feedback
description: Thoughts on how it works, what's confusing, or what you'd change
title: "Feedback: "
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: Thanks for trying Proto Database. This repo is public, so leave out anything private about a show.
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Your role
      description: Optional. It helps to know whose workflow this comes from.
      placeholder: e.g. A2, Production Audio, Associate Designer
